# Three separate axes plus a guard — never a cartesian product (PROJECT.md §9.2).
#
# This workflow deliberately does NOT read mise.toml and does not use
# jdx/mise-action. mise pins the development machine; CI's job is to sweep a
# matrix that a single pinned version would contradict. The one guarantee that
# makes the gap bearable: Node 20 — the version mise pins — must always appear
# in the matrix below. If one moves, the other moves in the same change.
#
# Ubuntu only. Windows is out of scope for v0.1, and the README says so.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The single place the pinned dev bun version is repeated. Not read from
  # mise.toml on purpose — see the note above.
  BUN_VERSION: "1.3.14"
  # The one cell where exact text snapshots run. Everywhere else the suite
  # self-gates down to tolerant invariants.
  SNAPSHOT_TYPESCRIPT: "5.9.3"

jobs:
  # Axis 0 — formatting and lint. `biome ci` never writes, unlike `bun run check`.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci

  # Axis 1 — TypeScript. Exact snapshots on 5.9.3, tolerant invariants elsewhere.
  typescript:
    name: ts ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ["5.4.5", "5.5.4", "5.6.3", "5.7.3", "5.8.3", "5.9.3", "6.0.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Pin the matrix compiler
        run: bun add -D --exact typescript@${{ matrix.typescript }}
      - name: The peer range must stay a range
        # `bun add` rewrites peerDependencies to an exact version when the
        # package is not already a devDependency. It bit once; it does not get
        # to bite silently in CI.
        run: |
          node -e '
            const peer = require("./package.json").peerDependencies.typescript;
            if (peer !== ">=5.4 <7") {
              console.error(`peerDependencies.typescript is "${peer}", expected ">=5.4 <7"`);
              process.exit(1);
            }
          '
      - run: bun run typecheck
      - run: bun run build
      - name: Fixtures must actually fail to compile
        run: bun run fixtures:verify
      - run: bun run test

  # Axis 2 — Node. Full suite on the pinned compiler.
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is mise.toml's pin and must stay here. 22 and 24 are the versions
        # users are otherwise on.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  # Axis 3 — installers. A packed tarball, installed five ways, must start and
  # produce a diagnostic. This is the first place the CLI can fail to run at all.
  install:
    name: install · ${{ matrix.installer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [npm, pnpm, yarn-node-modules, yarn-pnp, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Pack the tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/tssift-*.tgz)" >> "$GITHUB_ENV"

      - name: Scaffold a minimal broken project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe/src"
          cd "$RUNNER_TEMP/probe"
          cat > package.json <<'JSON'
          { "name": "probe", "private": true, "version": "0.0.0" }
          JSON
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "target": "ES2022",
              "lib": ["ES2022"],
              "module": "ESNext",
              "moduleResolution": "Bundler"
            }
          }
          JSON
          cat > src/index.ts <<'TS'
          interface User {
            id: string;
            email: string;
          }
          export const contact = (user: User): string => user.emailAddress;
          TS

      - name: Install the tarball and run the binary
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/probe"
          case "${{ matrix.installer }}" in
            npm)
              npm install --no-audit --no-fund "$TARBALL" typescript@${{ env.SNAPSHOT_TYPESCRIPT }}
              RUN="npx --no-install tssift"
              ;;
            pnpm)
              corepack enable
              corepack prepare pnpm@latest --activate
              # pnpm does not install peers by default: typescript is explicit,
              # which is exactly the topology difference §9.1 is about.
              pnpm add "$TARBALL" typescript@${{ env.SNAPSHOT_TYPESCRIPT }}
              RUN="pnpm exec tssift"
              ;;
            yarn-node-modules)
              corepack enable
              yarn set version stable
              yarn config set nodeLinker node-modules
              yarn add "$TARBALL" typescript@${{ env.SNAPSHOT_TYPESCRIPT }}
              RUN="yarn tssift"
              ;;
            yarn-pnp)
              corepack enable
              yarn set version stable
              yarn config set nodeLinker pnp
              yarn add "$TARBALL" typescript@${{ env.SNAPSHOT_TYPESCRIPT }}
              RUN="yarn tssift"
              ;;
            bun)
              bun add "$TARBALL" typescript@${{ env.SNAPSHOT_TYPESCRIPT }}
              RUN="bunx tssift"
              ;;
          esac

          set +e
          OUT=$($RUN --project tsconfig.json)
          CODE=$?
          set -e

          printf '%s\n' "$OUT"
          echo "exit=$CODE"

          test "$CODE" -eq 1 || { echo "expected exit 1, got $CODE"; exit 1; }
          printf '%s' "$OUT" | grep -q "TS2339" || { echo "expected a TS2339 in the report"; exit 1; }
          printf '%s' "$OUT" | grep -q "^root: " || { echo "expected the root header"; exit 1; }

  # Guard — a TypeScript 7 project must be refused, with the named message.
  # Without this job the "exit 2 with a named message" promise rots at the first
  # rewrite of the entry point.
  ts7-guard:
    name: guard · typescript 7 exits 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: A TypeScript 7 project exits 2, names the version, writes nothing to stdout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ts7/src"
          cd "$RUNNER_TEMP/ts7"
          npm init -y > /dev/null
          npm install --no-audit --no-fund typescript@7.0.2
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "strict": true, "noEmit": true, "skipLibCheck": true } }
          JSON
          echo 'export const x: number = 1;' > src/index.ts

          set +e
          OUT=$(node "$GITHUB_WORKSPACE/dist/cli.js" --project tsconfig.json 2> "$RUNNER_TEMP/err.txt")
          CODE=$?
          set -e
          ERR=$(cat "$RUNNER_TEMP/err.txt")

          echo "--- stderr ---"; printf '%s\n' "$ERR"
          echo "--- exit=$CODE, stdout bytes=${#OUT} ---"

          test "$CODE" -eq 2 || { echo "expected exit 2, got $CODE"; exit 1; }
          test -z "$OUT" || { echo "expected nothing on stdout"; exit 1; }
          printf '%s' "$ERR" | grep -q "Unsupported TypeScript version" || { echo "message not named"; exit 1; }
          printf '%s' "$ERR" | grep -q "7\.0\.2" || { echo "resolved version not reported"; exit 1; }
          printf '%s' "$ERR" | grep -q ">=5.4 <7" || { echo "supported range not reported"; exit 1; }
